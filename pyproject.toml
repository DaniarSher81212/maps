# =============================================================================
# pyproject.toml — главный конфигурационный файл проекта
#
# Этот файл — современный стандарт Python-проектов (PEP 517/518).
# Здесь описано:
#   - метаданные проекта (название, версия, автор)
#   - зависимости (что нужно установить)
#   - настройки инструментов (ruff, pytest)
#
# Установка всего одной командой:
#   pip install -e ".[dev]"
#   -e означает "editable" — изменения в коде сразу видны без переустановки
#   [dev] — устанавливает дополнительно инструменты для разработки
# =============================================================================

[build-system]
# Указываем, чем "собирать" пакет. setuptools — стандартный инструмент.
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maps"
version = "0.1.0"
description = "Material Allocation & Planning System — система распределения материалов для строительно-монтажных работ"
readme = "README.md"
requires-python = ">=3.11"

# Основные зависимости — нужны для работы самой системы
dependencies = [
    # --- Данные и Excel ---
    "pandas>=2.2.0",          # Таблицы DataFrame — основа обработки данных
    "openpyxl>=3.1.0",        # Чтение/запись .xlsx файлов

    # --- PostgreSQL ---
    "psycopg2-binary>=2.9.9", # Драйвер подключения к PostgreSQL
    "SQLAlchemy>=2.0.30",     # ORM: работа с БД через Python-классы
    "alembic>=1.13.0",        # Миграции: изменение схемы БД без потери данных

    # --- Валидация и настройки ---
    "pydantic>=2.6.0",           # Проверка типов и структур данных
    "pydantic-settings>=2.2.0",  # Загрузка конфигурации из .env файла

    # --- CLI и вывод ---
    "typer>=0.12.0",         # Создание команд CLI (удобнее click)
    "rich>=13.7.0",          # Красивый вывод: таблицы, цвета, прогресс

    # --- Окружение ---
    "python-dotenv>=1.0.0",  # Загрузка переменных из .env файла

    # --- API и веб ---
    "fastapi>=0.110.0",          # Веб-фреймворк для REST API
    "uvicorn[standard]>=0.29.0", # ASGI-сервер для запуска FastAPI
    "jinja2>=3.1.0",             # Шаблонизатор HTML для дашборда
    "python-multipart>=0.0.9",   # Поддержка загрузки файлов (multipart/form-data)

    # --- AI ---
    "anthropic>=0.40.0",  # Claude API для AI-анализа дефицита
]

[project.optional-dependencies]
# Зависимости только для разработки — не нужны на сервере
dev = [
    "pytest>=8.2.0",          # Фреймворк для написания и запуска тестов
    "pytest-cov>=5.0.0",      # Покрытие кода тестами (coverage report)
    "ruff>=0.4.0",            # Быстрый линтер + форматтер (заменяет flake8+black)
    "pre-commit>=3.7.0",      # Git-хуки: автоматически проверяют код перед коммитом
]

# Точка входа CLI: после установки можно запускать `maps` вместо `python main.py`
[project.scripts]
maps = "main:app"

# Указываем setuptools, где искать исходный код пакета
# find: автоматически найдёт все папки с __init__.py (app/, tests/ и т.д.)
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]  # Включаем только пакет app и все его подпакеты

# =============================================================================
# Настройки ruff — линтера и форматтера кода
# ruff проверяет: стиль, ошибки, неиспользуемые импорты и т.д.
# Запуск: ruff check .  (проверка)  |  ruff format .  (форматирование)
# =============================================================================
[tool.ruff]
target-version = "py311"   # Минимальная версия Python
line-length = 100           # Максимальная длина строки кода

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (отступы, пробелы)
    "W",   # pycodestyle warnings
    "F",   # pyflakes (неиспользуемые переменные, импорты)
    "I",   # isort (порядок импортов)
    "B",   # flake8-bugbear (частые ошибки)
    "UP",  # pyupgrade (устаревший синтаксис → современный)
]
ignore = [
    "E501",  # Длинные строки — ruff format сам их сократит
]

[tool.ruff.format]
quote-style = "double"        # Двойные кавычки для строк
indent-style = "space"        # Отступы пробелами (не табами)
docstring-code-format = true  # Форматировать код внутри docstring

# =============================================================================
# Настройки pytest — фреймворка для тестов
# Запуск: pytest              (все тесты)
#         pytest -v           (подробный вывод)
#         pytest --cov=app    (с отчётом покрытия)
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]          # Папка с тестами
python_files = ["test_*.py"]   # Файлы тестов начинаются с test_
python_functions = ["test_*"]  # Функции тестов начинаются с test_
addopts = "-v --tb=short"      # Подробный вывод + краткий traceback при ошибке
