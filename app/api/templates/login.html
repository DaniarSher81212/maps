<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPS — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.10);
        }
        .login-header {
            background: #212529;
            border-radius: 16px 16px 0 0;
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }
        .login-body {
            padding: 2rem;
        }
        .btn-login {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,.15);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card card">
        <!-- Шапка -->
        <div class="login-header">
            <div class="text-white mb-1" style="font-size: 2rem;">
                <i class="bi bi-boxes"></i>
            </div>
            <h5 class="text-white fw-bold mb-0">MAPS</h5>
            <div class="text-secondary small">Material Allocation & Planning System</div>
        </div>

        <!-- Форма -->
        <div class="login-body">
            <h6 class="text-muted mb-3 text-center">Вход в систему</h6>

            {% if error %}
            <div class="alert alert-danger alert-dismissible py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
                <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label small text-muted fw-semibold mb-1">Логин</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" name="username" class="form-control border-start-0"
                               placeholder="Введите логин" autocomplete="username" autofocus required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small text-muted fw-semibold mb-1">Пароль</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" name="password" class="form-control border-start-0"
                               placeholder="Введите пароль" autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100 btn-login fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
