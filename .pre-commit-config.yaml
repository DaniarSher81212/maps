# =============================================================================
# .pre-commit-config.yaml — конфигурация git-хуков
#
# Что такое pre-commit?
#   Это инструмент, который автоматически запускает проверки ПЕРЕД каждым
#   git commit. Если проверка не прошла — коммит отменяется, пока не исправишь.
#
# Установка хуков (один раз после клонирования репозитория):
#   pip install pre-commit
#   pre-commit install
#
# Ручной запуск на всех файлах:
#   pre-commit run --all-files
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # ruff — линтер и форматтер кода
  # Проверяет: стиль, ошибки, сортировку импортов, устаревший синтаксис
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff              # Проверка кода (lint)
        args: [--fix]         # Автоматически исправлять то, что можно
      - id: ruff-format       # Форматирование кода

  # ---------------------------------------------------------------------------
  # Базовые проверки файлов
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace   # Убирает пробелы в конце строк
      - id: end-of-file-fixer     # Файл должен заканчиваться переводом строки
      - id: check-yaml            # Проверяет корректность .yaml файлов
      - id: check-toml            # Проверяет корректность .toml файлов
      - id: check-added-large-files  # Предупреждает о больших файлах в git
        args: ["--maxkb=1000"]       # Файлы > 1MB не коммитим случайно
      - id: debug-statements      # Находит забытые print/breakpoint в коде
